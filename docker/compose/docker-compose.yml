services:
    # Postgres_LimeSurvey
    db_limesurvey:
        image: docker.io/library/postgres:16-alpine
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U limesurvey_user -d limesurvey_db"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - "limesurvey_pgdata:/var/lib/postgresql/data"
        environment:
            - POSTGRES_PASSWORD=limesurvey_password
            - POSTGRES_DB=limesurvey_db
            - POSTGRES_USER=limesurvey_user

    # LimeSurvey
    limesurvey:
        build:
            context: limesurvey/
            dockerfile: Dockerfile
        volumes:
            - "limesurvey_data:/var/www/limesurvey"
        environment:
            - LIMESURVEY_PORT=8080
            - LIMESURVEY_DB_TYPE=pgsql
            - LIMESURVEY_DB_HOST=db_limesurvey
            - LIMESURVEY_DB_PORT=5432
            - LIMESURVEY_DB=limesurvey_db
            - LIMESURVEY_DB_TABLE_PREFIX=lime_
            - LIMESURVEY_DB_USER=limesurvey_user
            - LIMESURVEY_DB_PASSWORD=limesurvey_password
            - LIMESURVEY_ADMIN_USER=limesurvey_admin
            - LIMESURVEY_ADMIN_NAME=limesurvey_admin
            - LIMESURVEY_ADMIN_EMAIL=limesurvey@limemail.com
            - LIMESURVEY_ADMIN_PASSWORD=limesurvey_admin_password
            - LIMESURVEY_URL_FORMAT=path
        ports:
            - "8080:8080"
        depends_on:
            - db_limesurvey

    # Postgres_NES
    db_nes:
        image: docker.io/library/postgres:16-alpine
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nes_user -d nes_db"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - "nes_pgdata:/var/lib/postgresql/data"
        environment:
            - POSTGRES_PASSWORD=nes_password
            - POSTGRES_DB=nes_db
            - POSTGRES_USER=nes_user
            - POSTGRES_HOST_AUTH_METHOD=md5
            - POSTGRES_INITDB_ARGS=--auth-host=md5

    # Neuroscience Experiments System
    nes:
        build:
            context: nes/
            dockerfile: Dockerfile
            args:
            - NES_BRANCH=master
        volumes:
            - "nes_data:/nes"
        environment:
            - NES_DB_TYPE=pgsql
            - NES_DB_HOST=db_nes
            - NES_DB=nes_db
            - NES_DB_USER=nes_user
            - NES_DB_PASSWORD=nes_password
            - NES_DB_PORT=5432
            - LIMESURVEY_HOST=limesurvey
            - LIMESURVEY_PORT=8080
            - LIMESURVEY_ADMIN_USER=limesurvey_admin
            - LIMESURVEY_ADMIN_PASSWORD=limesurvey_admin_password
            - NES_SECRET_KEY=_my_very_secret_key_
            - NES_IP=0.0.0.0
            - NES_PORT=8000
            - NES_ADMIN_USER=nes_admin
            - NES_ADMIN_EMAIL=nes_admin@nesmail.com
            - NES_ADMIN_PASSWORD=nes_admin_password
            # Fase6: staging/produção roda sem DEBUG. Dev local pode sobrescrever p/ True.
            - NES_DEBUG=False
        stdin_open: true
        tty: true
        ports:
         - "8000:8000"
        # Fase6: healthcheck via stdlib (imagem slim sem curl/wget).
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('NES_PORT','8000')+'/admin/login/')\""]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 120s
        depends_on:
            - db_nes
            - limesurvey

volumes:
    limesurvey_pgdata:
    nes_pgdata:
    limesurvey_data:
    nes_data:
