version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nes_db
      POSTGRES_USER: nes_user
      POSTGRES_PASSWORD: nes_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ../../..
      dockerfile: docker/compose/nes/Dockerfile
    command: python patientregistrationsystem/qdc/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      NES_DB_HOST: db
      NES_DB: nes_db
      NES_DB_USER: nes_user
      NES_DB_PASSWORD: nes_password
    depends_on:
      - db

volumes:
  pgdata:
