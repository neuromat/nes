# sudo docker compose -f docker/compose/nes/docker-compose.yml up
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nes_db
      POSTGRES_USER: nes_user
      POSTGRES_PASSWORD: nes_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ../../..
      dockerfile: docker/compose/nes/Dockerfile
    # command: python nes/patientregistrationsystem/qdc/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DB_INIT: "1"
      NES_DB_HOST: db
      NES_DB: nes_db
      NES_DB_USER: nes_user
      NES_DB_PASSWORD: nes_password
    depends_on:
      - db

volumes:
  pgdata:
